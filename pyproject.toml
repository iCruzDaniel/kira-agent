[project]
name = "kira-agent"
version = "0.1.0"
description = "Kira: agente de FAQ, cotizaciones y agendamiento para negocios"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "python-dotenv>=1.0.1",
    "strands-agents>=1.64.0",
    "strands-agents-tools>=0.9.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
