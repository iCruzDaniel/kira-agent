services:
  kira:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KIRA_DATA_DIR: /data
      KIRA_DB1_PATH: /data/db_1_business.sqlite3
      KIRA_DB2_PATH: /data/db_2_sessions.sqlite3
    volumes:
      - kira_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  kira_data:
